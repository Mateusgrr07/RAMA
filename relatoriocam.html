<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fcami.html">INÍCIO</a>
    <a href="relatoriomanutencaocam.html">RELATÓRIO DE MANUTENÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="relatoriocam">
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Operacional</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="placa">Placa Do Caminhão</label>
      <input type="text" id="placa" name="placa">

      <label for="data">Data</label>
      <input type="text" id="data" name="data">

      <label for="saida">Cidade de saída</label>
      <input type="text" id="saida" name="saida">

      <label for="chegada">Cidade de chegada</label>
      <input type="text" id="chegada" name="chegada">

      <label for="obs">Informações:</label>
      <textarea id="obs" name="observacoes"></textarea>

      <button type="submit" value="Enviar">Salvar</button>
    </form>
  </div>
  <div id="resultado"></div>
  <script>
      
       document.getElementById('meuFormulario').addEventListener('submit', function(event) {
            

            const nome = document.getElementById('nome').value;
            const placa = document.getElementById('placa').value;
            const data = document.getElementById('data').value;
            const saida = document.getElementById('saida').value;
            const chegada = document.getElementById('chegada').value;
            const obs = document.getElementById('obs').value;

            localStorage.setItem('nome', nome);
            localStorage.setItem('´placa', placa);
            localStorage.setItem('data', data);
            localStorage.setItem('saida', saida);
            localStorage.setItem('chegada', chegada);
            localStorage.setItem('obs', obs);
            
        });
    </script>

  
  <br>
  <br>
  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
