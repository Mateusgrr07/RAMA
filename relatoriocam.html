<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fcami.html">INÍCIO</a>
    <a href="relatoriomanutencaocam.html">RELATÓRIO DE MANUTENÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="operacional">
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Operacional</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="placa">Placa Do Caminhão</label>
      <input type="text" id="placa" name="placa" required>

      <label for="data">Data</label>
      <input type="date" id="data" name="data" required>

      <label for="saida">Cidade de saída</label>
      <input type="text" id="saida" name="saida" required>

      <label for="chegada">Cidade de chegada</label>
      <input type="text" id="chegada" name="chegada" required>

      <label for="obs">Informações:</label>
      <textarea id="obs" name="observacoes" rows="5"></textarea>

      <button type="submit">Salvar Relatório</button>
    </form>
  </div>
  <br>
  <br>
  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
  <script>
    document.getElementById("operacional").addEventListener("submit", function(event) {
      event.preventDefault();

      const relatorio = {
        tipo: document.getElementById("tipo").value,
        nome: document.getElementById("nome").value,
        placa: document.getElementById("placa").value,
        data: document.getElementById("data").value,
        saida: document.getElementById("saida").value,
        chegada: document.getElementById("chegada").value,
        observacoes: document.getElementById("obs").value
      };

      // Armazenamento separado
      const relatorios = JSON.parse(localStorage.getItem("relatoriosOperacionais")) || [];
      relatorios.push(relatorio);
      localStorage.setItem("relatoriosOperacionais", JSON.stringify(relatorios));

      alert("✅ Relatório operacional salvo com sucesso!");
      document.getElementById("operacional").reset();
    });
  </script>
</body>
</html>
