<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fcami.html">INÍCIO</a>
    <a href="relatoriomanutencaocam.html">RELATÓRIO DE MANUTENÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="operacional">
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Operacional</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="placa">Placa Do Caminhão</label>
      <input type="text" id="placa" name="placa" required>

      <label for="data">Data</label>
      <input type="date" id="data" name="data" required>

      <label for="saida">Cidade de saída</label>
      <input type="text" id="saida" name="saida" required>

      <label for="chegada">Cidade de chegada</label>
      <input type="text" id="chegada" name="chegada" required>

      <label for="obs">Informações:</label>
      <textarea id="obs" name="observacoes" rows="5"></textarea>

      <button type="submit">Salvar Relatório</button>
    </form>
  </div>
  <br>
  <br>
  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
<script>
    // Primeiro, verificamos se o usuário está logado
    document.addEventListener('DOMContentLoaded', () => {
        fetch('api/get_session.php')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Não autenticado');
                }
                return response.json();
            })
            .then(user => {
                if (!user.success) {
                    throw new Error('Não autenticado');
                }
                // Preenche o campo 'nome' automaticamente com o nome do usuário logado
                const nomeInput = document.getElementById("nome");
                if (nomeInput) {
                    nomeInput.value = user.nome;
                    nomeInput.readOnly = true; // Impede que o usuário mude o nome
                }
            })
            .catch(error => {
                // Se der erro, manda para o Login
                alert('Você precisa estar logado para acessar esta página.');
                window.location.href = 'Login.html';
            });
    });

    // Agora, o submit do formulário (o id do seu form é "operacional")
    const form = document.getElementById("operacional");

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // Evita o recarregamento da página

      // Usamos o FormData para pegar todos os campos do formulário
      const formData = new FormData(form);

      // Enviamos os dados para o PHP usando 'fetch'
      fetch('api/add_relatorio_op_cam.php', {
        method: 'POST',
        body: formData // Envia os dados do formulário
      })
      .then(response => response.json()) // Espera uma resposta JSON
      .then(data => {
        if (data.success) {
          alert("✅ Relatório operacional salvo no banco de dados!");
          form.reset();
          // Repõe o nome do usuário no campo desabilitado
           const nomeInput = document.getElementById("nome");
           if(nomeInput) fetch('api/get_session.php').then(r => r.json()).then(user => nomeInput.value = user.nome);
        } else {
          // Mostra o erro que veio do PHP
          alert("Erro: " + data.error);
        }
      })
      .catch(error => {
        console.error('Erro na requisição:', error);
        alert('Ocorreu um erro de conexão.');
      });
    });
  </script>
</body>
</html>
