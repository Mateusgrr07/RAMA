<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquinas</title>
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="stylesfooter.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="content">
    <h2>Máquinas</h2>
    <div id="lista"></div>
    <a href="addmaq.html"><button>Adicionar Maquina</button></a>
  </div>

  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>

<script>
    const lista = document.getElementById("lista");

    function carregar() {
      lista.innerHTML = "<p>🔄 Tentando carregar máquinas...</p>";

      fetch('api/get_maquinas.php')
        .then(response => {
            // Passo 1: Verificar se o arquivo PHP foi encontrado
            if (!response.ok) {
                throw new Error("Erro HTTP: " + response.status + " (Arquivo não encontrado ou erro no servidor)");
            }
            return response.text(); // Pegamos como texto primeiro para ver o que veio
        })
        .then(texto => {
            console.log("O servidor respondeu:", texto); // Olhe no F12 (Console) se der erro

            // Passo 2: Tentar converter para JSON
            try {
                return JSON.parse(texto);
            } catch (e) {
                throw new Error("O servidor não enviou um JSON válido. Conteúdo recebido: " + texto);
            }
        })
        .then(dados => {
          lista.innerHTML = "";

          // Passo 3: Verificar se o PHP retornou erro de Login/Permissão
          if (dados.error || dados.success === false) {
             lista.innerHTML = `<p style="color:red">⚠️ Erro do Sistema: ${dados.error}</p>`;
             if(dados.error.includes("autenticado") || dados.error.includes("logado")){
                 alert("Sessão expirada! Faça login novamente.");
                 window.location.href = 'Login.html';
             }
             return;
          }

          // Passo 4: Verificar se é uma lista válida
          if (!Array.isArray(dados)) {
              lista.innerHTML = "<p style='color:red'>⚠️ Formato de dados inválido recebido do servidor.</p>";
              console.error("Dados recebidos não são array:", dados);
              return;
          }
          
          // Passo 5: Mostrar os dados
          if (dados.length === 0) {
            lista.innerHTML = "<p>Nenhuma máquina encontrada no banco de dados.</p>";
          } else {
            dados.forEach(m => {
              const item = document.createElement("div");
              item.classList.add("relatorio-item");
              item.innerHTML = `
                <h3>${m.modelo}</h3>
                <p><strong>Código:</strong> ${m.codigo}</p>
                <p><strong>Tipo:</strong> ${m.tipo}</p>
                <p><strong>Ano:</strong> ${m.ano}</p>
                <button class="btn-excluir" onclick="excluir(${m.id})">🗑 Excluir</button>
                <hr>
              `;
              lista.appendChild(item);
            });
          }
        })
        .catch(error => {
            // Passo 6: Mostrar erro na tela se algo falhar
            console.error('Erro grave:', error);
            lista.innerHTML = `<p style='color:red; font-weight:bold'>❌ ERRO: ${error.message}</p>`;
        });
    }

    function excluir(id) {
      if (confirm("Tem certeza que deseja apagar esta máquina?")) {
        fetch('api/delete_maquina.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            alert('Máquina apagada com sucesso!');
            carregar();
          } else {
            alert('Erro ao apagar: ' + (data.error || "Erro desconhecido"));
          }
        })
        .catch(e => alert("Erro na conexão: " + e));
      }
    }

    // Chama a função assim que carrega
    carregar(); 
</script>
</body>
</html>
