<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquinas</title>
  <link rel="stylesheet" href="painel.css">
  <link rel="stylesheet" href="stylesfooter.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="content">
    <h2>Máquinas</h2>
    <div id="lista"></div>
    <a href="addmaq.html"><button>Adicionar Maquina</button></a>
  </div>

  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>

<script>
    const lista = document.getElementById("lista");

    function carregar() {
      lista.innerHTML = "<p>Carregando...</p>";
      fetch('api/get_maquinas.php')
        .then(r => r.json())
        .then(maquinas => {
          lista.innerHTML = "";
          if (maquinas.error) { alert(maquinas.error); return; }
          
          if (maquinas.length === 0) {
            lista.innerHTML = "<p>Nenhuma máquina encontrada no banco.</p>";
          } else {
            maquinas.forEach(m => {
              const item = document.createElement("div");
              item.classList.add("relatorio-item");
              item.innerHTML = `
                <h3>${m.modelo}</h3>
                <p><strong>Código:</strong> ${m.codigo}</p>
                <p><strong>Tipo:</strong> ${m.tipo}</p>
                <p><strong>Ano:</strong> ${m.ano}</p>
                <button class="btn-excluir" onclick="excluir(${m.id})">🗑 Excluir</button>
                <hr>
              `;
              lista.appendChild(item);
            });
          }
        });
    }

function excluir(id) {
      if (confirm("Apagar do Banco de Dados?")) {
        fetch('api/delete_maquina.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            alert('Máquina apagada!');
            carregar();
          } else {
            alert('Erro: ' + data.error);
          }
        });
      }
    }

    // --- ADICIONE ESTA LINHA ABAIXO ---
    carregar(); 
    // ----------------------------------

</script>
</body>
</html>
