<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios Salvos - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gcami.html">INÍCIO</a>
    <a href="rastrecam.html">RASTREAMENTO</a>
    <a href="addcam.html">ADICIONAR CAMINHÃO</a>
    <a href="relatcam.html">RELATORIOS OPERACIONAIS</a>
  </div>

  <div class="content">
    <h2>📄 Relatórios Salvos</h2>
    <div id="lista"></div>
  </div>
  <div><button onclick="window.location.href='novorelatoriomanu.html'">Adicionar relatorio</button></div>
  <br><br><br>

  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
<script>
    const lista = document.getElementById("lista");

    function carregar() {
      lista.innerHTML = "<p>Carregando...</p>";
      
      fetch('api/get_relatorios_manu_cam.php')
        .then(r => { if(!r.ok) window.location.href='Login.html'; return r.json(); })
        .then(relatorios => {
          lista.innerHTML = "";
          if (relatorios.length === 0) {
            lista.innerHTML = "<p>Nenhuma manutenção registrada.</p>";
            return;
          }
          relatorios.forEach(r => {
            lista.innerHTML += `
              <div class="relatorio-item">
                <h3>Manutenção #${r.id}</h3>
                <p><strong>Responsável:</strong> ${r.nome_usuario}</p>
                <p><strong>Placa:</strong> ${r.placa_caminhao}</p>
                <p><strong>Data:</strong> ${r.data_manutencao}</p>
                <p><strong>Detalhes:</strong> ${r.observacoes}</p>
                <button class="btn-excluir" onclick="excluir(${r.id})">Excluir</button>
                <hr>
              </div>
            `;
          });
        });
    }

    function excluir(id) {
      if (confirm("Apagar manutenção?")) {
        fetch('api/delete_relatorio_manu_cam.php', {
          method: 'POST',
          body: JSON.stringify({ id: id })
        }).then(() => { alert('Apagado!'); carregar(); });
      }
    }
    
    carregar();
  </script>
</body>
</html>
