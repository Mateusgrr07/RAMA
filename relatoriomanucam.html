<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios Salvos - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gcami.html">INÍCIO</a>
    <a href="rastrecam.html">RASTREAMENTO</a>
    <a href="addcam.html">ADICIONAR CAMINHÃO</a>
    <a href="relatcam.html">RELATORIOS OPERACIONAIS</a>
  </div>

  <div class="content">
    <h2>📄 Relatórios Salvos</h2>
    <div id="lista"></div>
  </div>
  <div><button onclick="window.location.href='novorelatoriomanu.html'">Adicionar relatorio</button></div>
  <br><br><br>

  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
  <script>
    const lista = document.getElementById("lista");

    function carregar() {
      lista.innerHTML = "";
      const relatorios = JSON.parse(localStorage.getItem("relatoriosManutencao")) || [];

     if (relatorios.length === 0) {
        lista.innerHTML = "<p>Nenhum relatório salvo ainda.</p>";
      } else {
        relatorios.forEach((r, i) => {
          const item = document.createElement("div");
          item.classList.add("relatorio-item");
          item.innerHTML = `
            <h3>Relatório de Manutenção ${i + 1}</h3>
            <p><strong>Nome:</strong> ${r.nome}</p>
            <p><strong>Placa:</strong> ${r.placa}</p>
            <p><strong>Data:</strong> ${r.data}</p>
            <p><strong>Informações:</strong> ${r.observacoes}</p>
            <button class="btn-excluir" onclick="excluir(${i})">Excluir</button>
            <hr>
          `;
          lista.appendChild(item);
        });
      }
    }

    function excluir(i) {
  const relatorios = JSON.parse(localStorage.getItem("relatoriosManutencao")) || [];

  if (confirm("Excluir este relatório?")) {
    relatorios.splice(i, 1); // remove o item selecionado
    localStorage.setItem("relatoriosManutencao", JSON.stringify(relatorios)); // salva de volta
    carregar(); // recarrega a lista atualizada
  }
}

// carrega a lista ao abrir a página
carregar();
  </script>
</body>
</html>
