<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreamento</title>
    <link rel="stylesheet" href="rastrecam.css">
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gcami.html">INÍCIO</a>
    <a href="addcam.html">ADICIONAR CAMINHÃO</a>
    <a href="relatcam.html">RELATORIOS PERSONALIZADOS</a>
  </div>
  <h1>Local do Caminhão</h1>
  <p>Clique no botão abaixo para ver a localização do caminhão:</p>
  <button onclick="mostrarLocal()">Ativar GPS</button>

  <p id="info"></p>
  <iframe id="mapa" src="" allowfullscreen></iframe>

  <script>
    function mostrarLocal() {
      const info = document.getElementById("info");
      const map = document.getElementById("mapa");

      if (navigator.geolocation) {
        info.innerHTML = "Obtendo localização...";

        navigator.geolocation.getCurrentPosition(
          function(posicao) {
            const lat = posicao.coords.latitude;
            const lon = posicao.coords.longitude;

            info.innerHTML = `Latitude: ${lat.toFixed(6)} <br>Longitude: ${lon.toFixed(6)}`;

            mapa.src = `https://www.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
          },
          function(erro) {
            info.innerHTML = "Não foi possível obter sua localização 😕";
          }
        );
      } else {
        info.innerHTML = "Seu navegador não suporta geolocalização.";
      }
    }
  </script>
</body>
</html>
