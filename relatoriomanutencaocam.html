<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fmaq.html">INÍCIO</a>
    <a href="relatoriocam.html">RELATÓRIO DE OPERAÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form>
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Manutenção</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="cargo">Placa do Caminhão</label>
      <input type="text" id="placa" name="placa">

      <label for="data">Data da Manutenção</label>
      <input type="date" id="data" name="data">

      <label for="obs">Informações da Manutenção:</label>
      <textarea id="obs" name="observacoes"></textarea>

      <button type="submit">Salvar</button>
    </form>
  </div>
  <br>
  <br>
  
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
