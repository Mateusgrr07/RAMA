<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Maquina</title>
  <link rel="stylesheet" href="add.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gmaq.html">INÍCIO</a>
    <a href="monitmaq.html">MONITORAMENTO</a>
    <a href="relatmaq.html">RELATORIOS</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">
    <h2>Cadastro de Máquinas</h2>

    <form id="formMaquina">
      <label for="codigo">Código:</label>
      <input type="text" id="codigo" name="codigo" required>

      <label for="modelo">Modelo da Máquina:</label>
      <input type="text" id="modelo" name="modelo" required>

      <label for="tipo">Tipo da Máquina:</label>
      <input type="text" id="tipo" name="tipo" required>

      <label for="ano">Ano da Máquina:</label>
      <input type="text" id="ano" name="ano" required>

      <button type="submit">Salvar Relatório</button>
    </form>
  </div>
<script>
    // Verifica login
    document.addEventListener('DOMContentLoaded', () => {
        fetch('api/get_session.php').then(r => r.json()).then(user => {
            if (!user.success) { alert('Faça login primeiro.'); window.location.href = 'Login.html'; }
        });
    });

    const form = document.getElementById("formMaquina");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(form);

      fetch('api/add_maquina.php', { method: 'POST', body: formData })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert("✅ Máquina salva no Banco de Dados!");
          form.reset();
        } else {
          alert("Erro: " + data.error);
        }
      })
      .catch(err => alert('Erro de conexão.'));
    });
  </script>
  <br>
  <br>
  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
