<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Maquina</title>
  <link rel="stylesheet" href="add.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gmaq.html">INÍCIO</a>
    <a href="monitmaq.html">MONITORAMENTO</a>
    <a href="relatmaq.html">RELATORIOS</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">
    <h2>Cadastro de Máquinas</h2>

    <form id="formMaquina">
      <label for="codigo">Código:</label>
      <input type="text" id="codigo" name="codigo" required>

      <label for="modelo">Modelo da Máquina:</label>
      <input type="text" id="modelo" name="modelo" required>

      <label for="tipo">Tipo da Máquina:</label>
      <input type="text" id="tipo" name="tipo" required>

      <label for="ano">Ano da Máquina:</label>
      <input type="text" id="ano" name="ano" required>

      <button type="submit">Salvar Relatório</button>
    </form>
  </div>
<script>
const form = document.getElementById("formMaquina");
const inputCodigo = document.getElementById("codigo");
const labelCodigo = document.querySelector("label[for='codigo']");

// Função para limpar os erros visuais antes de tentar de novo
function limparErros() {
    labelCodigo.style.color = ""; // Volta a cor original
    inputCodigo.style.borderColor = ""; 
    const msgExistente = document.getElementById("msg-erro-codigo");
    if (msgExistente) msgExistente.remove();
}

form.addEventListener("submit", function(e) {
    e.preventDefault();
    limparErros(); // Limpa erros anteriores

    const formData = new FormData(form);

    fetch('api/add_maquina.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert(" Máquina salva com sucesso!");
            form.reset();
        } else {
            // VERIFICA SE O ERRO É DE CÓDIGO DUPLICADO
            if (data.error === 'duplicate_code') {
                
                // 1. Pinta a label de vermelho
                labelCodigo.style.color = "red";
                inputCodigo.style.borderColor = "red"; // Opcional: pinta a borda do input

                // 2. Cria a mensagem pequena vermelha embaixo
                const smallError = document.createElement("small");
                smallError.id = "msg-erro-codigo";
                smallError.innerText = data.message; // "Código de máquina já existe"
                smallError.style.color = "red";
                smallError.style.display = "block"; // Garante que fique na linha de baixo
                smallError.style.marginTop = "5px";

                // Insere DEPOIS do input de código
                inputCodigo.after(smallError);
                
            } else {
                // Outros erros genéricos
                alert("Erro ao salvar: " + data.error);
            }
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        // Dica importante: Se der erro de JSON aqui, é provável que seu db.php tenha espaços em branco
        alert('Erro técnico ou de conexão. Verifique o console.');
    });
});
  </script>
  <br/>
  <br/>
  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
