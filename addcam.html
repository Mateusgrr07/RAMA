<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Caminhão</title>
  <link rel="stylesheet" href="add.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gcami.html">INÍCIO</a>
    <a href="rastrecam.html">RASTREAMENTO</a>
    <a href="relatcam.html">RELATÓRIOS</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="formCaminhao">
      <label for="placa">Placa</label>
      <input type="text" id="placa" name="placa" required>

      <label for="modelo">Modelo do Caminhão</label>
      <input type="text" id="modelo" name="modelo" required>

      <label for="familia">Família</label>
      <input type="text" id="familia" name="familia" required>

      <label for="ano">Ano do Veículo</label>
      <input type="text" id="ano" name="ano" required>

      <button type="submit">Adicionar</button>
    </form>
  </div>
  <br>
  <br>
  
  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>

  <script>
    // 1. Verificação de Sessão
    document.addEventListener('DOMContentLoaded', () => {
        fetch('api/get_session.php')
            .then(response => {
                if (!response.ok) throw new Error('Não autenticado');
                return response.json();
            })
            .then(user => {
                if (!user.success) throw new Error('Não autenticado');
                console.log('Usuário logado:', user.nome);
            })
            .catch(error => {
                alert('Você precisa estar logado para acessar esta página.');
                window.location.href = 'Login.html';
            });
    });

    // 2. Lógica do Formulário
    const form = document.getElementById("formCaminhao");
    const inputPlaca = document.getElementById("placa");
    const labelPlaca = document.querySelector("label[for='placa']");

    // Função para limpar os erros visuais
    function limparErros() {
        labelPlaca.style.color = ""; // Remove vermelho
        inputPlaca.style.borderColor = ""; // Remove borda vermelha
        const msgExistente = document.getElementById("msg-erro-placa");
        if (msgExistente) msgExistente.remove();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // Não recarrega a página
      
      limparErros(); // Limpa erros antigos antes de enviar

      const formData = new FormData(form);

      fetch('api/add_caminhao.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert("✅ Caminhão adicionado com sucesso!");
          form.reset(); // Limpa os campos
        } else {
          
          // AQUI É O PULO DO GATO: Se o erro for 'duplicate_code', fazemos o visual vermelho
          if (data.error === 'duplicate_code') {
             
              // 1. Muda cor da label e do input
              labelPlaca.style.color = "red";
              inputPlaca.style.borderColor = "red";

              // 2. Cria a mensagem de erro
              const smallError = document.createElement("small");
              smallError.id = "msg-erro-placa";
              smallError.innerText = data.message; // "Placa de caminhão já existe"
              smallError.style.color = "red";
              smallError.style.display = "block";
              smallError.style.marginTop = "5px";
              smallError.style.fontWeight = "bold";

              // 3. Coloca a mensagem embaixo do input
              inputPlaca.after(smallError);
              inputPlaca.focus();

          } else {
              // Se for outro erro qualquer, mostra o alerta normal
              alert("Erro: " + data.error);
          }
        }
      })
      .catch(error => {
        console.error('Erro na requisição:', error);
        alert('Ocorreu um erro de conexão.');
      });
    });
  </script>
</body>
</html>
