<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Caminhão</title>
  <link rel="stylesheet" href="add.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gcami.html">INÍCIO</a>
    <a href="rastrecam.html">RASTREAMENTO</a>
    <a href="relatcam.html">RELATÓRIOS</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="formCaminhao">
      <label for="placa">Placa</label>
      <input type="text" id="placa" name="placa" required>

      <label for="modelo">Modelo do Caminhão</label>
      <input type="text" id="modelo" name="modelo" required>

      <label for="familia">Família</label>
      <input type="text" id="familia" name="familia" required>

      <label for="ano">Ano do Veículo</label>
      <input type="text" id="ano" name="ano" required>

      <button type="submit">Adicionar</button>
    </form>
  </div>
  <br>
  <br>
   <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>

  <script>
    // Primeiro, verificamos se o usuário está logado
    document.addEventListener('DOMContentLoaded', () => {
        fetch('api/get_session.php')
            .then(response => {
                if (!response.ok) {
                    // Se a resposta não for OK (ex: 401), o usuário não está logado
                    throw new Error('Não autenticado');
                }
                return response.json();
            })
            .then(user => {
                if (!user.success) {
                    throw new Error('Não autenticado');
                }
                // Se chegou aqui, o usuário está logado.
                console.log('Usuário logado:', user.nome);
            })
            .catch(error => {
                // Se der erro, manda para o Login
                alert('Você precisa estar logado para acessar esta página.');
                window.location.href = 'Login.html';
            });
    });

    // Agora, o submit do formulário
    const form = document.getElementById("formCaminhao");

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // Evita o recarregamento da página

      // Usamos o FormData para pegar todos os campos do formulário
      const formData = new FormData(form);

      // Enviamos os dados para o PHP usando 'fetch'
      fetch('api/add_caminhao.php', {
        method: 'POST',
        body: formData // Envia os dados do formulário
      })
      .then(response => response.json()) // Espera uma resposta JSON
      .then(data => {
        if (data.success) {
          alert("✅ Caminhão adicionado ao banco de dados!");
          form.reset();
        } else {
          // Mostra o erro que veio do PHP
          alert("Erro: " + data.error);
        }
      })
      .catch(error => {
        console.error('Erro na requisição:', error);
        alert('Ocorreu um erro de conexão.');
      });
    });
  </script>
</body>
</html>
