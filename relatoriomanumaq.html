<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios de Manutenção - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
  
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gmaq.html">INÍCIO</a>
    <a href="addmaq.html">ADICIONAR MAQUINA</a>
    <a href="monitmaq.html">MONITORAMENTO DE MAQUINA</a>
    <a href="relatmaq.html">RELATORIOS OPERACIONAL</a>
  </div>

  <div class="content">
    <h2>📋 Relatórios de Manutenção Salvos</h2>
    <div id="listaRelatorios"></div>
    <br><br><br><br><br>
    <a href="novorelatoriomaq.html"><button>Adicionar relatorio</button></a>
  </div>

<script>
    const lista = document.getElementById("listaRelatorios");

    function carregar() {
      lista.innerHTML = "<p>Carregando...</p>";
      
      fetch('api/get_relatorios_manu_maq.php')
        .then(r => { if(!r.ok) window.location.href='Login.html'; return r.json(); })
        .then(relatorios => {
          lista.innerHTML = "";
          if (relatorios.length === 0) {
            lista.innerHTML = "<p>Nenhuma manutenção registrada.</p>";
            return;
          }
          relatorios.forEach(r => {
            lista.innerHTML += `
              <div class="relatorio-item">
                <hr>
                <h3>Manutenção #${r.id}</h3>
                <p><strong>Responsável:</strong> ${r.nome_usuario}</p>
                <p><strong>Máquina:</strong> ${r.codigo_maquina}</p>
                <p><strong>Data:</strong> ${r.data_manutencao}</p>
                <p><strong>Detalhes:</strong> ${r.observacoes}</p>
                <button class="btn-excluir" onclick="excluir(${r.id})">Excluir</button>
              </div>
            `;
          });
        });
    }

    function excluir(id) {
      if (confirm("Apagar manutenção?")) {
        fetch('api/delete_relatorio_manu_maq.php', {
          method: 'POST',
          body: JSON.stringify({ id: id })
        }).then(() => { alert('Apagado!'); carregar(); });
      }
    }
    
    carregar();
  </script>
  <br>
  <br>
   <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
