<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios de Manutenção - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
  
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gmaq.html">INÍCIO</a>
    <a href="addmaq.html">ADICIONAR MAQUINA</a>
    <a href="monitmaq.html">MONITORAMENTO DE MAQUINA</a>
    <a href="relatmaq.html">RELATORIOS OPERACIONAL</a>
  </div>

  <div class="content">
    <h2>📋 Relatórios de Manutenção Salvos</h2>
    <div id="listaRelatorios"></div>
  </div>

  <script>
    function carregar() {
      const lista = document.getElementById("listaRelatorios");
      const relatorios = JSON.parse(localStorage.getItem("relatoriosManutencaoMaq")) || [];

      lista.innerHTML = ""; // limpa antes de recriar

      if (relatorios.length === 0) {
        lista.innerHTML = "<p>Nenhum relatório salvo ainda.</p>";
      } else {
        relatorios.forEach((r, i) => {
          const item = document.createElement("div");
          item.classList.add("relatorio-item");
          item.innerHTML = `
            <hr>
            <h3>Relatório ${i + 1}</h3>
            <p><strong>Tipo:</strong> ${r.tipo}</p>
            <p><strong>Nome:</strong> ${r.nome}</p>
            <p><strong>Código da Máquina:</strong> ${r.maquina}</p>
            <p><strong>Data:</strong> ${r.data}</p>
            <p><strong>Informações:</strong> ${r.observacoes}</p>
            <button class="btn-excluir" onclick="excluir(${i})">Excluir</button>
          `;
          lista.appendChild(item);
        });
      }
    }
    function excluir(i) {
      const relatorios = JSON.parse(localStorage.getItem("relatoriosManutencaoMaq")) || [];
      if (confirm("Excluir este relatório?")) {
        relatorios.splice(i, 1);
        localStorage.setItem("relatoriosManutencaoMaq", JSON.stringify(relatorios));
        carregar();
      }
    }

    carregar();
  </script>
  <br>
  <br>
   <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
