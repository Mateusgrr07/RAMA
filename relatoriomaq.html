<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Operacional - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fmaq.html">INÍCIO</a>
    <a href="relatoriomanutencaomaq.html">RELATÓRIO DE MANUTENÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="operacionalmaq">
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Operacional</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="codigo">Código da Máquina</label>
      <input type="text" id="codigo" name="codigo">

      <label for="data">Data</label>
      <input type="date" id="data" name="data">

      <label for="tempo">Tempo de Uso</label>
      <input type="text" id="tempo" name="tempo">

      <label for="obs">Informações:</label>
      <textarea id="obs" name="observacoes"></textarea>

      <button type="submit">Salvar</button>
    </form>

  <script>
    // 1. Verifica se está logado e preenche o nome automaticamente
    document.addEventListener('DOMContentLoaded', () => {
        fetch('api/get_session.php')
            .then(response => response.json())
            .then(user => {
                if (!user.success) {
                    alert('Você precisa estar logado.');
                    window.location.href = 'Login.html';
                } else {
                    // Preenche o campo nome e trava ele
                    const nomeInput = document.getElementById("nome");
                    if(nomeInput) {
                        nomeInput.value = user.nome;
                        nomeInput.readOnly = true;
                    }
                }
            });
    });

    // 2. Envia o formulário para o PHP
    document.getElementById("operacionalmaq").addEventListener("submit", function(event) {
      event.preventDefault();

      const formData = new FormData(this);

      fetch('api/add_relatorio_op_maq.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert("✅ Relatório operacional salvo no Banco de Dados!");
          this.reset();
          // Recarrega a página para garantir que o nome volte preenchido
          location.reload();
        } else {
          alert("Erro: " + data.error);
        }
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Erro de conexão.');
      });
    });
  </script>
  <footer>
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
