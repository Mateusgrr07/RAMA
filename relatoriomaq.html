<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Operacional - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fmaq.html">INÍCIO</a>
    <a href="relatoriomanutencaomaq.html">RELATÓRIO DE MANUTENÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="operacionalmaq">
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Operacional</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="codigo">Código da Máquina</label>
      <input type="text" id="codigo" name="codigo">

      <label for="data">Data</label>
      <input type="date" id="data" name="data">

      <label for="tempo">Tempo de Uso</label>
      <input type="text" id="tempo" name="tempo">

      <label for="obs">Informações:</label>
      <textarea id="obs" name="observacoes"></textarea>

      <button type="submit">Salvar</button>
    </form>

  <script>
    document.getElementById("operacionalmaq").addEventListener("submit", function(event) {
      event.preventDefault();

      const relatorio = {
        tipo: document.getElementById("tipo").value,
        nome: document.getElementById("nome").value,
        codigo: document.getElementById("codigo").value,
        data: document.getElementById("data").value,
        tempo: document.getElementById("tempo").value,
        observacoes: document.getElementById("obs").value
      };

      // Armazena separadamente os relatórios operacionais
      const relatorios = JSON.parse(localStorage.getItem("relatoriosOperacionaisMaq")) || [];
      relatorios.push(relatorio);
      localStorage.setItem("relatoriosOperacionaisMaq", JSON.stringify(relatorios));

      alert("✅ Relatório operacional salvo com sucesso!");
      document.getElementById("operacionalmaq").reset();
    });
  </script>

  <footer>
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
