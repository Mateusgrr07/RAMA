<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - RAMA</title>
    <link rel="stylesheet" href="styleshome.css">
</head>

<body>
    <section class="fundo">
        <h1 class="titulo">Transgrãos: Uma História de Crescimento e Liderança</h1>
    </section>     

    <section class="login-container">
    <div class="login-form">
      
        <h2>Cadastro</h2>
        <form action="home.php" method="POST" onsubmit="return validarFormulario()">

            <label>Nome completo:</label>
            <input type="text" name="nome" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Cargo:</label><br>
            <input type="checkbox" id="gerente" name="cargo" value="Gerente" onclick="selecionarCargo(this)"> Gerente
            <input type="checkbox" id="funcionario" name="cargo" value="Funcionario" onclick="selecionarCargo(this)">
            Funcionário

            <div id="opcoesFuncionario" style="display:none; margin-top:10px;">
                <label>Setor:</label><br>
                <input type="checkbox" name="setor" value="Maquinas" onclick="selecionarSetor(this)"> Máquinas
                <input type="checkbox" name="setor" value="Caminhoes" onclick="selecionarSetor(this)"> Caminhões
            </div>

            <label>Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label>Confirmar senha:</label>
            <input type="password" id="confirmarSenha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p>Já tem uma conta? <a href="Login.html">Faça login aqui</a></p>

    </div>
    <div class="login-image">
      <img src="IMG/Sem título.jpg" alt="Caminhões">
    </div>
  </section>
    
   

    <script src="JS/node.js" defer></script>
</body>

</html>
