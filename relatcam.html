<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios Salvos - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gcami.html">INÍCIO</a>
    <a href="rastrecam.html">RASTREAMENTO</a>
    <a href="addcam.html">ADICIONAR CAMINHÃO</a>
    <a href="relatoriomanucam.html">RELATORIOS DE MANUTENÇÃO</a>
  </div>

  <div class="content">
    <h2>📄 Relatórios Salvos</h2>
    <div id="lista"></div>
  </div>

  <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
<script>
    const lista = document.getElementById("lista");
    function carregar() {
      fetch('api/get_relatorios_op_cam.php').then(r => r.json()).then(relatorios => {
          lista.innerHTML = "";
          if(relatorios.length === 0) { lista.innerHTML = "<p>Nada encontrado.</p>"; return; }
          
          relatorios.forEach(r => {
              lista.innerHTML += `
                <div class="relatorio-item">
                <h3>Relatório #${r.id}</h3>
                <p><strong>Motorista:</strong> ${r.nome_usuario}</p>
                <p><strong>Placa:</strong> ${r.placa_caminhao}</p>
                <p><strong>Data:</strong> ${r.data_operacao}</p>
                <p><strong>Saída/Chegada:</strong> ${r.saida} / ${r.chegada}</p>
                <p><strong>Obs:</strong> ${r.observacoes}</p>
                <button class="btn-excluir" onclick="excluir(${r.id})">Excluir</button>
                </div>`;
          });
      });
    }
    function excluir(id) {
        if(confirm("Excluir?")) fetch('api/delete_relatorio_op_cam.php', { method: 'POST', body: JSON.stringify({id}) }).then(() => carregar());
    }
    carregar();
  </script>
</body>
</html>
