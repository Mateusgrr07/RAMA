<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="relatcam.css">
</head>
<body>
    <div id="resultado"></div>
    
    <script>
        const nome = localStorage.getItem('nome');
        const placa = localStorage.getItem('placa');
        const data = localStorage.getItem('data');
        const saida = localStorage.getItem('saida');
        const chegada = localStorage.getItem('chegada');
        const obs = localStorage.getItem('obs');
        

        const resultadoDiv = document.getElementById('resultado');

        if (nome) {
            resultadoDiv.innerHTML = `
                <p>${nome}</p>
                <p>${placa}</p>
                <p>${data}</p>
                <p>${saida}</p>
                <p>${chegada}</p>
                <p>${obs}</p>
            `;
        } else {
            resultadoDiv.innerHTML = `<p>Nenhum dado de formulário foi encontrado.</p>`;
        }

    </script>

</body>
</html>
