<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="relatorio.css">
    <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
     <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gmaq.html">INÍCIO</a>
    <a href="addmaq.html">ADICIONAR MAQUINA</a>
    <a href="monitmaq.html">MONITORAMENTO DE MAQUINA</a>
    <a href="relatoriomanumaq.html">RELATORIOS DE MANUTENÇÃO</a>
  </div>
  </div>

  <div class="content">
    <h2>📋 Relatórios Operacionais de Máquinas</h2>
    <div id="listaRelatorios"></div>
  </div>

  <script>
    // O ID da sua lista é "listaRelatorios"
    const lista = document.getElementById("listaRelatorios");

    // A função carregar agora busca os dados do PHP
    function carregar() {
      lista.innerHTML = "<p>Carregando relatórios...</p>";

      fetch('api/get_relatorios_op_maq.php') // Faz a chamada para a API
        .then(response => {
            if (!response.ok) {
                 alert('Sessão expirada. Faça login novamente.');
                 window.location.href = 'Login.html';
                 throw new Error('Não autenticado');
            }
            return response.json();
        })
        .then(relatorios => { // 'relatorios' é a lista que veio do PHP
          lista.innerHTML = ""; // Limpa a lista
          
          if (relatorios.length === 0) {
            lista.innerHTML = "<p>Nenhum relatório cadastrado no banco.</p>";
          } else {
            relatorios.forEach(r => { 
              const item = document.createElement("div");
              item.classList.add("relatorio-item");
              
              // Usando os dados do banco (r.id, r.codigo_maquina, etc.)
              // E o r.nome_usuario que veio do JOIN
              item.innerHTML = `
                <hr>
                <h3>Relatório Operacional (ID: ${r.id})</h3>
                <p><strong>Criado por:</strong> ${r.nome_usuario}</p>
                <p><strong>Código da Máquina:</strong> ${r.codigo_maquina}</p>
                <p><strong>Data:</strong> ${r.data_operacao}</p>
                <p><strong>Tempo de Uso:</strong> ${r.tempo_uso}</p>
                <p><strong>Informações:</strong> ${r.observacoes}</p>
                <button class="btn-excluir" onclick="excluir(${r.id})">Excluir</button>
                <hr>
              `;
              lista.appendChild(item);
            });
          }
        })
        .catch(error => {
            console.error('Erro ao carregar:', error);
            lista.innerHTML = "<p>Erro ao carregar dados.</p>";
        });
    }

    // A função excluir agora manda o ID para o PHP
    function excluir(id_do_relatorio) {
      if (confirm("Excluir este relatório do banco de dados?")) {
        
        fetch('api/delete_relatorio_op_maq.php', {
          method: 'POST', 
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id: id_do_relatorio }) // Envia o ID
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('Relatório excluído com sucesso!');
            carregar(); // Recarrega a lista
          } else {
            alert('Erro ao excluir: ' + data.error);
          }
        })
        .catch(error => {
            console.error('Erro ao excluir:', error);
            alert('Erro de conexão ao tentar excluir.');
        });
      }
    }

    // Carrega os dados assim que a página abre
    carregar();
  </script>
  <br>
  <br>
   <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
