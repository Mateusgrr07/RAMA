<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="relatorio.css">
    <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
     <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Gmaq.html">INÍCIO</a>
    <a href="addmaq.html">ADICIONAR MAQUINA</a>
    <a href="monitmaq.html">MONITORAMENTO DE MAQUINA</a>
    <a href="relatoriomanumaq.html">RELATORIOS DE MANUTENÇÃO</a>
  </div>
  </div>

  <div class="content">
    <h2>📋 Relatórios Operacionais de Máquinas</h2>
    <div id="listaRelatorios"></div>
  </div>

<script>
    const lista = document.getElementById("listaRelatorios");

    function carregar() {
      lista.innerHTML = "<p>Carregando relatórios...</p>";

      fetch('api/get_relatorios_op_maq.php')
        .then(response => {
            if (!response.ok) {
                 alert('Sessão expirada. Faça login novamente.');
                 window.location.href = 'Login.html';
                 throw new Error('Não autenticado');
            }
            return response.json();
        })
        .then(relatorios => {
          lista.innerHTML = "";
          
          if (relatorios.length === 0) {
            lista.innerHTML = "<p>Nenhum relatório encontrado no banco.</p>";
          } else {
            relatorios.forEach(r => {
              const item = document.createElement("div");
              item.classList.add("relatorio-item");
              item.innerHTML = `
                <hr>
                <h3>Relatório #${r.id}</h3>
                <p><strong>Operador:</strong> ${r.nome_usuario}</p>
                <p><strong>Máquina:</strong> ${r.codigo_maquina}</p>
                <p><strong>Data:</strong> ${r.data_operacao}</p>
                <p><strong>Tempo de Uso:</strong> ${r.tempo_uso}</p>
                <p><strong>Obs:</strong> ${r.observacoes}</p>
                <button class="btn-excluir" onclick="excluir(${r.id})">Excluir</button>
                <hr>
              `;
              lista.appendChild(item);
            });
          }
        })
        .catch(error => {
            console.error('Erro:', error);
            lista.innerHTML = "<p>Erro ao carregar dados.</p>";
        });
    }

    function excluir(id) {
      if (confirm("Excluir este relatório permanentemente?")) {
        fetch('api/delete_relatorio_op_maq.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            alert('Apagado com sucesso!');
            carregar();
          } else {
            alert('Erro ao apagar: ' + data.error);
          }
        });
      }
    }

    carregar();
  </script>
  <br>
  <br>
   <footer class="footer">
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
