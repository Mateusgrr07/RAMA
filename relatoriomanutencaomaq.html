<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório - TransGrãos</title>
  <link rel="stylesheet" href="relatorio.css">
  <link rel="stylesheet" href="stylesfooter.css">
</head>
<body>
  <div class="sidebar">
    <img src="IMG/RamaSemFundo.png" alt="Logo Rama">
    <a href="Fmaq.html">INÍCIO</a>
    <a href="relatoriomaq.html">RELATÓRIO DE OPERAÇÃO</a>
  </div>

  <div class="content">
    <img src="IMG/transgraos.png" alt="TransGrãos" class="logo">

    <form id="manutencaomaq">
      <label for="tipo">Tipo de Relatório</label>
      <select id="tipo" name="tipo">
        <option>Manutenção</option>
      </select>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="maquina">Código da Máquina</label>
      <input type="text" id="maquina" name="maquina">

      <label for="data">Data da Manutenção</label>
      <input type="date" id="data" name="data">

      <label for="obs">Informações da Manutenção:</label>
      <textarea id="obs" name="observacoes"></textarea>

      <button type="submit">Salvar</button>
    </form>
  </div>

  <script>
    // 1. Verifica login
    document.addEventListener('DOMContentLoaded', () => {
        fetch('api/get_session.php').then(r => r.json()).then(user => {
            if(!user.success) {
                window.location.href = 'Login.html';
            } else {
                const nomeInput = document.getElementById("nome");
                if(nomeInput) { nomeInput.value = user.nome; nomeInput.readOnly = true; }
            }
        });
    });

    // 2. Envia formulário
    document.getElementById("manutencaomaq").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(this);

      fetch('api/add_relatorio_manu_maq.php', {
        method: 'POST',
        body: formData
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          alert("✅ Manutenção de Máquina salva no Banco!");
          this.reset();
          location.reload();
        } else {
          alert("Erro: " + data.error);
        }
      })
      .catch(err => alert('Erro de conexão.'));
    });
  </script>
  
  <footer>
    <img src="IMG/TransgraõsSemfundo.png" alt="TransGrãos" class="footer-logo">
  </footer>
</body>
</html>
